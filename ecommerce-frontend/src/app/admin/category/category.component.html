<mat-card class="content-panel">
  <mat-card-header class="panel-header">
    <mat-card-title>Manage Categories</mat-card-title>
    <span class="spacer"></span>
    <button
      mat-raised-button
      color="primary"
      *ngIf="canEdit"
      (click)="openCreateModal()"
    >
      <mat-icon>add</mat-icon> Add Category
    </button>
  </mat-card-header>

  <mat-card-content>
    <table
      mat-table
      [dataSource]="categories"
      class="categories-table mat-elevation-z2"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="slug">
        <th mat-header-cell *matHeaderCellDef>Slug</th>
        <td mat-cell *matCellDef="let category">{{ category.slug }}</td>
      </ng-container>

      <ng-container matColumnDef="parent">
        <th mat-header-cell *matHeaderCellDef>Parent Category</th>
        <td mat-cell *matCellDef="let category">
          <span *ngIf="category.parent_id">{{ category.parent_id.name }}</span>
          <span *ngIf="!category.parent_id" style="color: #888"
            >None (Top Level)</span
          >
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let category" class="action-buttons">
          <button
            mat-icon-button
            color="primary"
            (click)="openEditModal(category)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="deleteCategory(category._id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td
          class="mat-cell text-center"
          [attr.colspan]="displayedColumns.length"
        >
          No categories found.
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>

<!-- Category Form Modal -->
<div class="modal-overlay" *ngIf="isModalOpen">
  <mat-card class="modal-content">
    <mat-card-header class="modal-header">
      <mat-card-title>{{
        isEditMode ? "Edit Category" : "Add Category"
      }}</mat-card-title>
      <span class="spacer"></span>
      <button mat-icon-button class="close-btn" (click)="closeModal()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-card-header>
    <form (ngSubmit)="saveCategory()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Category Name</mat-label>
          <input
            matInput
            type="text"
            name="name"
            [(ngModel)]="formData.name"
            required
          />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Slug</mat-label>
          <input
            matInput
            type="text"
            name="slug"
            [(ngModel)]="formData.slug"
            placeholder="Auto-generated if left blank"
          />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Parent Category</mat-label>
          <mat-select name="parent_id" [(ngModel)]="formData.parent_id">
            <mat-option value="">None (Top Level)</mat-option>
            <mat-option
              *ngFor="let parent of parentCategories"
              [value]="parent._id"
            >
              {{ parent.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
        >
          {{ isEditMode ? "Update Category" : "Create Category" }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
