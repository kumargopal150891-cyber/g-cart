<mat-sidenav-container class="admin-layout">
  <!-- Sidebar -->
  <mat-sidenav mode="side" [opened]="isSidebarOpen" class="sidebar">
    <mat-toolbar color="primary" class="sidebar-header">
      <span *ngIf="isSidebarOpen">Admin Panel</span>
      <span *ngIf="!isSidebarOpen" class="icon-only">AP</span>
    </mat-toolbar>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/admin/product" routerLinkActive="active">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Products</span>
      </a>
      <a mat-list-item routerLink="/admin/category" routerLinkActive="active">
        <mat-icon matListItemIcon>folder</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Categories</span>
      </a>
      <a mat-list-item routerLink="/admin/filters" routerLinkActive="active">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Filters</span>
      </a>
      <a mat-list-item routerLink="/admin/offers" routerLinkActive="active">
        <mat-icon matListItemIcon>local_offer</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Offers</span>
      </a>
      <a mat-list-item routerLink="/admin/users" routerLinkActive="active">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle *ngIf="isSidebarOpen">Users</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="topbar">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Dashboard</span>
      <span class="spacer"></span>

      <button mat-button [matMenuTriggerFor]="profileMenu" class="profile-btn">
        <img [src]="userDetails.image" alt="Profile" class="profile-img" />
        <span>{{ userDetails.name }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #profileMenu="matMenu">
        <button mat-menu-item (click)="openProfileModal()">
          <mat-icon>person</mat-icon>
          <span>My Profile</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Profile Update Modal -->
<div class="modal-overlay" *ngIf="isProfileModalOpen">
  <mat-card class="modal-content">
    <mat-card-header class="modal-header">
      <mat-card-title>Update Profile</mat-card-title>
      <span class="spacer"></span>
      <button mat-icon-button (click)="closeProfileModal()"><mat-icon>close</mat-icon></button>
    </mat-card-header>

    <form (ngSubmit)="updateProfile()">
      <mat-card-content>
        <div class="profile-image-upload">
          <div *ngIf="!isCameraOpen" class="preview-section">
            <img [src]="imagePreview || userDetails.image" alt="Preview" class="preview-img" />
            <div class="upload-actions">
              <button type="button" mat-stroked-button (click)="fileInput.click()"><mat-icon>upload_file</mat-icon> Upload File</button>
              <input #fileInput type="file" (change)="onImageSelected($event)" accept="image/*" style="display: none" />
              <button type="button" mat-flat-button color="primary" (click)="openCamera()"><mat-icon>camera_alt</mat-icon> Use Camera</button>
            </div>
          </div>

          <div *ngIf="isCameraOpen" class="camera-section">
            <video #videoElement class="camera-video"></video>
            <canvas #canvasElement style="display: none"></canvas>
            <div class="camera-actions">
              <button type="button" mat-flat-button color="accent" (click)="capturePhoto()"><mat-icon>camera</mat-icon> Capture</button>
              <button type="button" mat-stroked-button color="warn" (click)="closeCamera()">Cancel</button>
            </div>
          </div>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput type="text" name="name" [(ngModel)]="updateData.name" required />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="updateData.email" required />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password (Optional)</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="updateData.password" placeholder="Leave blank to keep current" />
        </mat-form-field>
      </mat-card-content>
      
      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" class="full-width">Save Changes</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
